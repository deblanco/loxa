name = "loxa"
main = "src/index.ts"
compatibility_date = "2025-08-01"

# --- Credit ledger ----------------------------------------------------------
# Local dev creates its own SQLite file; database_id only matters for deploy.
# Fill it in after `wrangler d1 create loxa`.
[[d1_databases]]
binding = "DB"
database_name = "loxa"
# Local dev ignores this and makes its own SQLite file, so it only blocks a
# deploy. Not shared with WhiskerMind under any circumstances: one ledger for
# two apps means one app's credits paying for the other's renders.
database_id = "ffdfda67-385e-456e-a377-307e8e85b2da"

# --- Render cache -----------------------------------------------------------
# Keyed on a hash of the photo, the style and the colour, so a retry of the
# identical request is free rather than a second $0.03. One namespace,
# key-prefixed by feature ("tryon:").
# Fill in `id` after `wrangler kv namespace create RESULTS_CACHE`.
[[kv_namespaces]]
binding = "RESULTS_CACHE"
id = "2765fb39e7924fcf9c3fe8f93be03edc"   # loxa-results-cache. WhiskerMind has its own; they must never share one.

# --- Style thumbnails -------------------------------------------------------
# Served rather than bundled, so the catalogue can grow by uploading files
# instead of shipping an app release. The style strip already says "All 24".
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "loxa-assets"

[vars]
# --- Image model ------------------------------------------------------------
# Gemini 3.1 Flash-Lite Image ("Nano Banana 2 Lite"), reached on the global
# endpoint. Measured on WhiskerMind at 1120 output tokens per image — $0.034 —
# which is the cheapest model that can actually be *shown* the photo. Imagen 4
# Fast is $0.02 but text-to-image only, so it cannot render this face, and a
# stranger with the right haircut is the one thing this app must not return.
#
# `global` rather than a region, and that is a price decision: Google lists this
# model's per-token rate under the global endpoint and several regional
# endpoints carry a surcharge. Nothing here needs pinning to a region.
#
# At $0.034 a render, $9.99 for 20 photos is $0.68 of model against $9.99 of
# revenue before Apple's cut — the 70% margin floor the plan asks for, with
# room. The single photo at $0.99 is not close to the margin question.
#
# The key is GOOGLE_SA_KEY, a secret: `wrangler secret put GOOGLE_SA_KEY < key.json`.
#
# Loxa's own project, with its own service account (`loxa-cf`) and its own
# quota — a shared project would mean one app's rate limit becoming the other's
# outage. GOOGLE_SA_KEY and this id move together or not at all.
GOOGLE_PROJECT_ID = "loxa-506814"
IMAGE_MODEL = "gemini-3.1-flash-lite-image"

# --- Fallback provider ------------------------------------------------------
# The same model, reached through OpenRouter when Vertex will not answer.
#
# The quota above is the reason: about one image a minute, project-wide, and
# this model is published on `global` only, so there is no region to escape to
# and concurrency does not help. OpenRouter serves it from its own Google AI
# Studio and Vertex accounts, neither of which is loxa-506814 — a second
# provider is the only thing that raises the ceiling.
#
# Billed at $30 per million image-output tokens, and this model is measured at
# 1120 of them per image: $0.034, the same as calling Vertex directly. A render
# that falls back costs what it would have cost anyway.
#
# The slug is the same model as IMAGE_MODEL, spelled OpenRouter's way, and the
# two move together. Written out rather than derived by prefixing "google/":
# the catalogues are not obliged to stay in step, and a drifted slug is a 404
# on the one path nobody exercises until it is needed.
#
# Off until the key is set, and that is a supported state — one provider, and
# exactly the behaviour this Worker had before there were two:
#
#   wrangler secret put OPENROUTER_API_KEY
OPENROUTER_IMAGE_MODEL = "google/gemini-3.1-flash-lite-image"

# --- Entitlements -----------------------------------------------------------
# The weekly subscription is verified server-side, against RevenueCat API v2,
# with a secret key:
#
#   wrangler secret put REVENUECAT_SECRET_KEY     # the `sk_` key, not the app's
#
# It must be a V2 key: v1's /subscribers endpoint answers 403 to one, and the
# adapter's fail-closed branch would turn that into "nobody is a subscriber"
# without saying so. The ids below are not secrets — they are path segments.
#
# With no key set the stub answers false and every device reads as free — which
# now means no render at all, since the free credit was withdrawn. That is
# deliberate: a deployment that cannot verify a purchase must not assume one.
# Loxa's own RevenueCat project, never WhiskerMind's: that one sells a different
# entitlement ("pro") and different products, so pointing Loxa at it would have
# every real customer read as free.
#
# The entitlement id is here as well as the lookup key because the v2 answer
# uses it. Measured, not assumed: asked for a real customer's active
# entitlements, the API named `entl1aeb4e8cd9` and not `loxa_pro`, so a
# deployment carrying only the lookup key would read a paying subscriber as
# free — silently, because the adapter fails closed.
#
# Both are path segments, not secrets. The `sk_` key is the secret and is set
# with `wrangler secret put`.
REVENUECAT_PROJECT_ID = "projeb2c8f9f"
REVENUECAT_WEEKLY_ENTITLEMENT_ID = "entl1aeb4e8cd9"
# RevenueCat's own id for loxa_single_photo_099. The v2 purchase object names
# products by this, not by the store identifier, so without it no photo
# purchase verifies and no credit is granted.
REVENUECAT_SINGLE_PHOTO_PRODUCT_ID = "prod4c50338ed7"

# --- Not yet used -----------------------------------------------------------
# The try-on route is synchronous. The queue earns its keep somewhere around
# 5-15s of generation; this model has only been timed on single calls, and a
# real device on a real network has not said so yet. Uncomment when it does.
#
# [[queues.producers]]
# binding = "RENDER_QUEUE"
# queue = "render-queue"

# --- Custom domain ----------------------------------------------------------
# One label under blankhexadecimal.com, not api.loxa.*: Universal SSL covers a
# single subdomain level and a second would need Advanced Certificate Manager.
# The zone lives on the same account, so the first deploy creates the record.
[[routes]]
pattern = "loxa-api.blankhexadecimal.com"
custom_domain = true

# --- Observability ----------------------------------------------------------
# Sub-blocks override the top-level `enabled`, so logs and traces are on.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
